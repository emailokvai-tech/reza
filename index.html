    <script>
      // Gracefully handle harmless Vite HMR WebSocket connection notifications in dev iframe
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('vite:ws')) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || '')) || '';
        if (msg.includes('WebSocket') || (e.filename && e.filename.includes('@vite/client'))) {
          e.preventDefault();
        }
      });
    </script>
