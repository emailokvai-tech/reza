    <meta name="description" content="Vulture Eyes (ভালচার আইস) - দুর্নীতির ওপর তীক্ষ্ণ নজরদারি। Operated under UK Company Registration No: 17041560. সম্পাদক: Tarek Anwar Khan | প্রকাশক: দেবাশীষ ঘোষ মিশু।" />
    <meta property="og:title" content="Vulture Eyes (ভালচার আইস) - সত্যের সন্ধানে নির্ভীক অনুসন্ধানী পোর্টাল" />
    <meta property="og:description" content="Operated under UK Company Registration No: 17041560 (Registered in England & Wales). সম্পাদক: Tarek Anwar Khan | প্রকাশক: দেবাশীষ ঘোষ মিশু। এটি দুর্নীতি দমন কমিশনের সাপোর্টিভ একটি প্রকাশনা সংস্থা।" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800;900&family=Noto+Serif+Bengali:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
      // Gracefully handle harmless Vite HMR WebSocket connection notifications in dev iframe
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('vite:ws')) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || '')) || '';
        if (msg.includes('WebSocket') || (e.filename && e.filename.includes('@vite/client'))) {
          e.preventDefault();
        }
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
